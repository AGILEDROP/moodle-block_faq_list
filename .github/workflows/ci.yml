name: Run all tests

# Run this workflow every time a new commit pushed to your repository
on: [push, pull_request]

permissions:
  contents: read

jobs:
  setup:
    name: ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:14' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        # Health check to wait for postgres to start.
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle-branch: MOODLE_400_STABLE, php: '7.4', database: mariadb}
          - {moodle-branch: MOODLE_401_STABLE, php: '7.4', database: mariadb}
          - {moodle-branch: MOODLE_402_STABLE, php: '8.0', database: mariadb}
          - {moodle-branch: MOODLE_403_STABLE, php: '8.2', database: mariadb}
          - {moodle-branch: MOODLE_404_STABLE, php: '8.1', database: mariadb}
          - {moodle-branch: MOODLE_405_STABLE, php: '8.3', database: mariadb}
          - {moodle-branch: MOODLE_400_STABLE, php: '7.4', database: pgsql}
          - {moodle-branch: MOODLE_401_STABLE, php: '7.4', database: pgsql}
          - {moodle-branch: MOODLE_402_STABLE, php: '8.0', database: pgsql}
          - {moodle-branch: MOODLE_403_STABLE, php: '8.2', database: pgsql}
          - {moodle-branch: MOODLE_404_STABLE, php: '8.1', database: pgsql}
          - {moodle-branch: MOODLE_405_STABLE, php: '8.3', database: pgsql}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          # Clone in plugin subdir, so we can setup CI in default directory.
          path: plugin
          persist-credentials: false

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Deploy moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          # Add dirs to $PATH
          echo "$PWD/ci/bin" >> "$GITHUB_PATH"
          echo "$PWD/ci/vendor/bin" >> "$GITHUB_PATH"
          # PHPUnit depends on en_AU.UTF-8 locale
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install moodle-plugin-ci
        # Need explicit IP to stop mysql client fail on attempt to use unix socket.
        run: moodle-plugin-ci install -vvv --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Run phplint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: Run phpcpd
        if: ${{ always() }}
        run: moodle-plugin-ci phpcpd || true

      - name: Run phpmd
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Run codechecker
        if: ${{ always() }}
        run: moodle-plugin-ci codechecker

      - name: Run validate
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Run savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Run mustache
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: Run grunt
        if: ${{ always() }}
        run: moodle-plugin-ci grunt

      - name: Run phpdoc
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc

      - name: Run phpunit
        if: ${{ always() }}
        run: |
             moodle-plugin-ci phpunit
             cd moodle
             vendor/bin/phpunit --fail-on-risky --disallow-test-output --filter tool_dataprivacy_metadata_registry_testcase
             vendor/bin/phpunit --fail-on-risky --disallow-test-output --testsuite core_privacy_testsuite --filter provider_testcase

      - name: Run behat
        if: ${{ always() }}
        run: moodle-plugin-ci behat --profile chrome
